name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: the lockfile is generated on Windows and npm
      # omits Linux-only optional-dep entries (@emnapi/* under tailwind oxide),
      # which makes npm ci's strict sync check fail on the ubuntu runner.
      - run: npm install --no-audit --no-fund
      # A push to master IS a production deploy, so the gates run first:
      # lint, then the build (which type-checks), then the static guards
      # over out/ — banned viewport units, image pairs and their declared
      # sizes, dead asset links, the page-weight budget. Any failure stops
      # the job before the artifact upload, and nothing ships.
      - run: npm run lint
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
